name: Publish Docker image to Docker Hub

on:
  push:
    branches: [ main ]
  pull_request:
    types: [closed]

jobs:
  build-and-push:
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image version
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          DATE=$(date -u +"%Y%m%d%H%M%S")
          VERSION="v${DATE}-${SHORT_SHA}"
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
          echo "DATE=$DATE" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./App
          file: ./App/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/minikube-exercise-app:${{ env.VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/minikube-exercise-app:latest
